samplesheet: "config/samples.tsv"
get_fastq:
  PE: true
  tool: "fasterq_dump"
  fastq_dump:
    extra: "-X 10000"
  fasterq_dump:
    extra: ""
trimming:
  tool: "cutadapt"
  fastp:
    extra: ""
  fastplong:
    extra: ""
  cutadapt:
    adapters: "-a NNNNNNNNTGGAATTCTCGGGTGCCAAGG -A NNNNNNNNGATCGTCGGACTGTAGAACTCTGAAC"
    extra: "--overlap 6 --error-rate 0.1 --minimum-length 18 --pair-filter=any"
umi_extraction:
  enabled: true  # Set to true to enable UMI extraction
  tool: "umi_tools"
  umi_tools:
    extra: "--bc-pattern=NNNNNNNN --bc-pattern2=NNNNNNNN"
qc:
  multiqc:
    extra: "--verbose --dirs"
  fastqc:
    extra: "--quiet"
